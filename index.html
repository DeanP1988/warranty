                    onChange={e => setExpiryDate(e.target.value)} 
                    className="w-full bg-slate-800/90 border border-blue-500/40 rounded-xl px-3 py-1.5 text-white text-xs font-semibold"
                  />
                </div>

                {/* Scopes */}
                <div>
                  <span className="text-[11px] text-slate-300 block mb-1">Coverage Scope</span>
                  <div className="flex flex-wrap gap-1.5">
                    {allScopes.map(scope => {
                      const active = coverageScope.includes(scope);
                      return (
                        <button
                          type="button"
                          key={scope}
                          onClick={() => toggleScope(scope)}
                          className={`text-[10px] px-2.5 py-1 rounded-full font-medium transition ${
                            active 
                              ? 'bg-blue-600 text-white' 
                              : 'bg-slate-800 text-slate-400 border border-slate-700'
                          }`}
                        >
                          {scope}
                        </button>
                      );
                    })}
                  </div>
                </div>

                <div className="flex items-center justify-between pt-1">
                  <span className="text-[11px] text-slate-300">Product Registered with Brand</span>
                  <button
                    type="button"
                    onClick={() => setIsRegistered(!isRegistered)}
                    className={`w-11 h-6 rounded-full transition-colors relative p-0.5 ${isRegistered ? 'bg-emerald-500' : 'bg-slate-700'}`}
                  >
                    <div className={`w-5 h-5 rounded-full bg-white transition-transform ${isRegistered ? 'translate-x-5' : 'translate-x-0'}`} />
                  </button>
                </div>
              </div>

              {/* Receipt */}
              <div className="space-y-2 pt-2 border-t border-slate-800">
                <label className="text-[10px] font-bold uppercase tracking-wider text-slate-400">4. Receipt & Proof</label>
                
                <div className="flex items-center space-x-2">
                  <label className="flex-1 cursor-pointer bg-slate-800 hover:bg-slate-700 border border-slate-700 border-dashed rounded-xl p-2.5 text-center flex items-center justify-center space-x-2 text-slate-300 transition">
                    <LucideIcon name="Camera" size={16} className="text-blue-400" />
                    <span className="text-[11px] font-medium">Attach Receipt / Photo</span>
                    <input 
                      type="file" 
                      accept="image/*" 
                      className="hidden" 
                      onChange={handleSimulatedReceiptUpload} 
                    />
                  </label>

                  {receiptImage && (
                    <button 
                      type="button" 
                      onClick={() => setReceiptImage(null)}
                      className="text-red-400 text-[10px] underline hover:text-red-300"
                    >
                      Remove
                    </button>
                  )}
                </div>

                {receiptImage && (
                  <div className="relative rounded-lg overflow-hidden border border-slate-700 h-20 w-28 mx-auto">
                    <img src={receiptImage} alt="Receipt preview" className="w-full h-full object-cover" />
                  </div>
                )}
              </div>

              <div className="pt-2">
                <button
                  type="submit"
                  className="w-full bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-600/30 text-xs transition"
                >
                  {item ? 'Save Warranty Changes' : 'Confirm & Protect Item'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
