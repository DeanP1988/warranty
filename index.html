<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Warranty Vault</title>

  <!-- iOS PWA & Home Screen Optimization -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Warranty Vault" />
  <meta name="theme-color" content="#0b0e14" />

  <!-- iOS Safari strictly requires real PNG format (SVGs result in a white box on iOS Home Screen) -->
  <link id="apple-touch-icon-main" rel="apple-touch-icon" sizes="180x180" href="" />
  <link id="apple-touch-icon-precomposed" rel="apple-touch-icon-precomposed" sizes="180x180" href="" />
  <link id="favicon-png" rel="icon" type="image/png" sizes="192x192" href="" />

  <!-- Synchronous script to immediately generate a high-res 180x180 PNG data URI for iOS Safari -->
  <script>
    (function generateAppleTouchPng() {
      try {
        var size = 180;
        var canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext('2d');

        // Draw dark rounded background
        ctx.fillStyle = '#0b0e14';
        ctx.fillRect(0, 0, size, size);

        // Inner dark blue-slate plate
        var pad = 14;
        var innerW = size - (pad * 2);
        var r = 32;
        ctx.fillStyle = '#111827';
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(pad + r, pad);
        ctx.arcTo(pad + innerW, pad, pad + innerW, pad + innerW, r);
        ctx.arcTo(pad + innerW, pad + innerW, pad, pad + innerW, r);
        ctx.arcTo(pad, pad + innerW, pad, pad, r);
        ctx.arcTo(pad, pad, pad + innerW, pad, r);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Draw Shield in center
        var cx = size / 2;
        var cy = 40;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + 46, cy + 20);
        ctx.bezierCurveTo(cx + 46, cy + 62, cx + 25, cy + 96, cx, cy + 108);
        ctx.bezierCurveTo(cx - 25, cy + 96, cx - 46, cy + 62, cx - 46, cy + 20);
        ctx.closePath();

        // Gradient fill for shield
        var grad = ctx.createLinearGradient(cx - 46, cy, cx + 46, cy + 108);
        grad.addColorStop(0, '#38bdf8');
        grad.addColorStop(0.5, '#2563eb');
        grad.addColorStop(1, '#4f46e5');
        ctx.fillStyle = grad;
        ctx.fill();

        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // Inner dark vault circle
        ctx.beginPath();
        ctx.arc(cx, cy + 54, 25, 0, Math.PI * 2);
        ctx.fillStyle = '#090d16';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Checkmark
        ctx.beginPath();
        ctx.moveTo(cx - 11, cy + 54);
        ctx.lineTo(cx - 3, cy + 63);
        ctx.lineTo(cx + 12, cy + 46);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 5.5;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();

        var pngUri = canvas.toDataURL('image/png');

        var link1 = document.getElementById('apple-touch-icon-main');
        var link2 = document.getElementById('apple-touch-icon-precomposed');
        var link3 = document.getElementById('favicon-png');
        if (link1) link1.href = pngUri;
        if (link2) link2.href = pngUri;
        if (link3) link3.href = pngUri;

        // Dynamic Manifest with valid PNG Data URI
        var manifestObj = {
          name: "Warranty Vault",
          short_name: "WarrantyVault",
          start_url: ".",
          display: "standalone",
          background_color: "#0b0e14",
          theme_color: "#0b0e14",
          icons: [
            {
              src: pngUri,
              sizes: "180x180",
              type: "image/png",
              purpose: "any maskable"
            }
          ]
        };
        var manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
        var manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = URL.createObjectURL(manifestBlob);
        document.head.appendChild(manifestLink);
      } catch (e) {
        console.error('Failed to generate PNG icon', e);
      }
    })();
  </script>

  <!-- Fonts & Tailwind CSS CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'Courier New', 'monospace']
          }
        }
      }
    };
  </script>

  <!-- React 18, ReactDOM & Babel -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons Bundle -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

  <style>
    /* Prevent rubber-banding and scrollbar flicker on iOS */
    html, body {
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    input, textarea, select {
      user-select: auto;
      -webkit-user-select: auto;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    /* Safe-area insets for notched iPhones */
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .pt-safe {
      padding-top: env(safe-area-inset-top, 12px);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-blue-500/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // Helper: Dynamic Lucide Icon wrapper compatible with all Lucide UMD builds
    function LucideIcon({ name, size = 18, className = '', strokeWidth = 2 }) {
      const containerRef = useRef(null);

      useEffect(() => {
        if (!containerRef.current) return;
        containerRef.current.innerHTML = '';

        // Convert PascalCase (e.g. ShieldCheck) to kebab-case (e.g. shield-check)
        const kebabName = name
          .replace(/([a-z0-9])([A-Z])/g, '$1-$2')
          .replace(/([A-Z])([A-Z][a-z])/g, '$1-$2')
          .toLowerCase();

        // 1. Check if lucide.createElement is available (standard for modern UMD bundle)
        if (window.lucide) {
          const iconDef = (window.lucide.icons && (window.lucide.icons[name] || window.lucide.icons[kebabName]))
            || (window.lucide[name]);

          if (iconDef && typeof window.lucide.createElement === 'function') {
            try {
              const svg = window.lucide.createElement(iconDef, {
                width: size,
                height: size,
                'stroke-width': strokeWidth,
                class: className
              });
              containerRef.current.appendChild(svg);
              return;
            } catch (err) {
              // Fall through to attribute-based creation
            }
          }

          // 2. Legacy .toSvg() support if present
          if (iconDef && typeof iconDef.toSvg === 'function') {
            containerRef.current.innerHTML = iconDef.toSvg({
              class: className,
              width: size,
              height: size,
              'stroke-width': strokeWidth
            });
            return;
          }
        }

        // 3. Fallback: Create element with data-lucide attribute and run createIcons()
        const iEl = document.createElement('i');
        iEl.setAttribute('data-lucide', kebabName);
        iEl.className = className;
        iEl.style.width = `${size}px`;
        iEl.style.height = `${size}px`;
        containerRef.current.appendChild(iEl);

        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons({
            root: containerRef.current,
            attrs: {
              width: size,
              height: size,
              'stroke-width': strokeWidth
            }
          });
        }
      }, [name, size, className, strokeWidth]);

      return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0 pointer-events-none" />;
    }

    // Default Initial Data: Initialized to empty as requested
    const INITIAL_ITEMS = [];

    const CATEGORIES = [
      { name: 'All', icon: 'Layers' },
      { name: 'Appliances', icon: 'Coffee' },
      { name: 'Electronics', icon: 'Laptop' },
      { name: 'Vehicles', icon: 'Car' },
      { name: 'Home & Tools', icon: 'Wrench' },
      { name: 'Furniture', icon: 'Grid' },
      { name: 'Other', icon: 'Tag' }
    ];

    // Main App Component
    function App() {
      const [items, setItems] = useState(() => {
        try {
          const saved = localStorage.getItem('warranty_items_v2');
          return saved !== null ? JSON.parse(saved) : INITIAL_ITEMS;
        } catch {
          return INITIAL_ITEMS;
        }
      });

      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [sortBy, setSortBy] = useState('expiry');

      const [selectedItem, setSelectedItem] = useState(null);
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);
      const [scannerActive, setScannerActive] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem('warranty_items_v2', JSON.stringify(items));
        } catch (e) {
          console.error('Storage full or unavailable', e);
        }
      }, [items]);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 2800);
      };

      const getWarrantyStatus = (expiryDateStr) => {
        if (!expiryDateStr) return { status: 'unknown', label: 'No Expiry', daysLeft: 0, badgeClass: 'bg-slate-700/60 text-slate-300 border-slate-600' };
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const exp = new Date(expiryDateStr);
        exp.setHours(0, 0, 0, 0);
        const diffTime = exp.getTime() - today.getTime();
        const daysLeft = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

        if (daysLeft < 0) {
          return { status: 'expired', label: 'Expired', daysLeft, badgeClass: 'bg-red-500/15 text-red-400 border-red-500/30' };
        } else if (daysLeft <= 30) {
          return { status: 'expiring', label: `Expiring (${daysLeft}d)`, daysLeft, badgeClass: 'bg-amber-500/15 text-amber-400 border-amber-500/30' };
        } else {
          return { status: 'active', label: 'Active', daysLeft, badgeClass: 'bg-emerald-500/15 text-emerald-400 border-emerald-500/30' };
        }
      };

      const stats = useMemo(() => {
        let active = 0, expiring = 0, expired = 0, totalProtectedValue = 0;
        items.forEach(item => {
          const { status } = getWarrantyStatus(item.expiryDate);
          if (status === 'active') active++;
          else if (status === 'expiring') expiring++;
          else if (status === 'expired') expired++;

          if (status !== 'expired' && item.price) {
            totalProtectedValue += Number(item.price);
          }
        });
        return { active, expiring, expired, total: items.length, totalProtectedValue };
      }, [items]);

      const filteredItems = useMemo(() => {
        return items
          .filter(item => {
            const matchesCat = selectedCategory === 'All' || item.category === selectedCategory;
            const q = searchQuery.toLowerCase().trim();
            const matchesSearch = !q ||
              item.name.toLowerCase().includes(q) ||
              item.brand?.toLowerCase().includes(q) ||
              item.serialNumber?.toLowerCase().includes(q) ||
              item.modelNumber?.toLowerCase().includes(q) ||
              item.retailer?.toLowerCase().includes(q);
            return matchesCat && matchesSearch;
          })
          .sort((a, b) => {
            if (sortBy === 'name') return a.name.localeCompare(b.name);
            if (sortBy === 'price') return (b.price || 0) - (a.price || 0);
            const expA = new Date(a.expiryDate || '2099-01-01').getTime();
            const expB = new Date(b.expiryDate || '2099-01-01').getTime();
            return expA - expB;
          });
      }, [items, selectedCategory, searchQuery, sortBy]);

      const handleSaveItem = (itemData) => {
        if (editingItem) {
          setItems(prev => prev.map(i => i.id === editingItem.id ? { ...itemData, id: editingItem.id } : i));
          showToast('Warranty item updated');
          if (selectedItem?.id === editingItem.id) {
            setSelectedItem({ ...itemData, id: editingItem.id });
          }
        } else {
          const newItem = { ...itemData, id: `item-${Date.now()}` };
          setItems(prev => [newItem, ...prev]);
          showToast('New warranty protected!');
        }
        setIsFormOpen(false);
        setEditingItem(null);
      };

      const handleDeleteItem = (id) => {
        setItems(prev => prev.filter(i => i.id !== id));
        if (selectedItem?.id === id) {
          setSelectedItem(null);
        }
        showToast('Item removed from Vault');
      };

      const handleResetData = () => {
        setItems([]);
        localStorage.removeItem('warranty_items_v2');
        showToast('Vault cleared');
      };

      return (
        <div className="min-h-screen bg-slate-950 flex justify-center text-slate-100 font-sans antialiased">
          <div className="w-full max-w-md min-h-screen bg-gradient-to-b from-[#11141b] via-[#0f1117] to-[#090b0e] flex flex-col relative shadow-2xl">

            {/* In-app Toast message */}
            {toastMessage && (
              <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-slate-800/95 backdrop-blur-xl border border-slate-700 text-white px-4 py-2 rounded-full text-xs font-medium shadow-2xl flex items-center space-x-2 transition-all">
                <LucideIcon name="CheckCircle2" size={16} className="text-emerald-400" />
                <span>{toastMessage}</span>
              </div>
            )}

            {/* Content Body */}
            <div className="flex-1 overflow-y-auto pb-28 pt-safe">
              {activeTab === 'dashboard' && (
                <DashboardView 
                  stats={stats} 
                  items={items} 
                  onSelectItem={setSelectedItem}
                  onAddItem={() => { setEditingItem(null); setIsFormOpen(true); }}
                  getWarrantyStatus={getWarrantyStatus}
                  setActiveTab={setActiveTab}
                />
              )}

              {activeTab === 'items' && (
                <AllItemsView 
                  items={filteredItems}
                  searchQuery={searchQuery}
                  setSearchQuery={setSearchQuery}
                  selectedCategory={selectedCategory}
                  setSelectedCategory={setSelectedCategory}
                  sortBy={sortBy}
                  setSortBy={setSortBy}
                  onSelectItem={setSelectedItem}
                  onAddItem={() => { setEditingItem(null); setIsFormOpen(true); }}
                  getWarrantyStatus={getWarrantyStatus}
                />
              )}

              {activeTab === 'analytics' && (
                <AnalyticsView 
                  items={items}
                  stats={stats}
                />
              )}

              {activeTab === 'settings' && (
                <SettingsView 
                  items={items}
                  onImportItems={(imported) => {
                    setItems(imported);
                    showToast(`Restored ${imported.length} items`);
                  }}
                  onResetData={handleResetData}
                  showToast={showToast}
                />
              )}
            </div>

            {/* iOS Bottom Navigation Bar */}
            <div className="fixed bottom-0 inset-x-0 mx-auto max-w-md bg-[#0d0f15]/95 backdrop-blur-xl border-t border-white/10 px-4 pt-2.5 pb-safe z-40 flex justify-around items-center">
              <button 
                onClick={() => setActiveTab('dashboard')} 
                className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'dashboard' ? 'text-blue-400 scale-105' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <LucideIcon name="Home" size={20} />
                <span className="text-[10px] font-medium tracking-tight">Overview</span>
              </button>

              <button 
                onClick={() => setActiveTab('items')} 
                className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'items' ? 'text-blue-400 scale-105' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <LucideIcon name="Grid" size={20} />
                <span className="text-[10px] font-medium tracking-tight">Items</span>
              </button>

              {/* Floating Add Button */}
              <button 
                onClick={() => { setEditingItem(null); setIsFormOpen(true); }}
                className="flex items-center justify-center -mt-6 w-12 h-12 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 text-white shadow-lg shadow-blue-500/30 active:scale-95 transition-transform border border-blue-400/40 p-3"
                aria-label="Add Warranty"
              >
                <LucideIcon name="Plus" size={24} strokeWidth={2.5} />
              </button>

              <button 
                onClick={() => setActiveTab('analytics')} 
                className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'analytics' ? 'text-blue-400 scale-105' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <LucideIcon name="BarChart3" size={20} />
                <span className="text-[10px] font-medium tracking-tight">Insights</span>
              </button>

              <button 
                onClick={() => setActiveTab('settings')} 
                className={`flex flex-col items-center gap-1 transition-all ${activeTab === 'settings' ? 'text-blue-400 scale-105' : 'text-slate-400 hover:text-slate-200'}`}
              >
                <LucideIcon name="Settings" size={20} />
                <span className="text-[10px] font-medium tracking-tight">Settings</span>
              </button>
            </div>

            {/* Item Detail Sheet */}
            {selectedItem && (
              <ItemDetailModal 
                item={selectedItem} 
                onClose={() => setSelectedItem(null)}
                onEdit={() => {
                  setEditingItem(selectedItem);
                  setIsFormOpen(true);
                }}
                onDelete={() => handleDeleteItem(selectedItem.id)}
                getWarrantyStatus={getWarrantyStatus}
              />
            )}

            {/* Add / Edit Sheet */}
            {isFormOpen && (
              <AddEditItemModal
                item={editingItem}
                onClose={() => { setIsFormOpen(false); setEditingItem(null); }}
                onSave={handleSaveItem}
                scannerActive={scannerActive}
                setScannerActive={setScannerActive}
              />
            )}

          </div>
        </div>
      );
    }

    // VIEW: Dashboard
    function DashboardView({ stats, items, onSelectItem, onAddItem, getWarrantyStatus, setActiveTab }) {
      const expiringItems = useMemo(() => {
        return items.filter(i => {
          const status = getWarrantyStatus(i.expiryDate);
          return status.status === 'expiring';
        });
      }, [items, getWarrantyStatus]);

      const recentItems = useMemo(() => [...items].slice(0, 4), [items]);

      return (
        <div className="p-4 space-y-4">
          <div className="flex justify-between items-center pt-1">
            <div className="flex items-center space-x-3">
              <div className="relative w-11 h-11 rounded-2xl overflow-hidden shadow-md border border-cyan-500/30 bg-slate-900 shrink-0 flex items-center justify-center">
                <svg viewBox="0 0 512 512" className="w-full h-full">
                  <defs>
                    <linearGradient id="dbBg" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stopColor="#1e293b"/>
                      <stop offset="100%" stopColor="#090d16"/>
                    </linearGradient>
                    <linearGradient id="dbShield" x1="0%" y1="0%" x2="100%" y2="100%">
                      <stop offset="0%" stopColor="#38bdf8"/>
                      <stop offset="50%" stopColor="#2563eb"/>
                      <stop offset="100%" stopColor="#4f46e5"/>
                    </linearGradient>
                  </defs>
                  <rect width="512" height="512" fill="url(#dbBg)"/>
                  <path d="M256 100 L380 156 C380 270 326 358 256 396 C186 358 132 270 132 156 Z" fill="url(#dbShield)"/>
                  <circle cx="256" cy="246" r="68" fill="#0f172a" stroke="#38bdf8" strokeWidth="8"/>
                  <path d="M226 246 L248 268 L292 220" fill="none" stroke="#38bdf8" strokeWidth="16" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </div>
              <div>
                <span className="text-[10px] uppercase font-bold tracking-wider text-blue-400 block">Personal Vault</span>
                <h1 className="text-xl font-bold tracking-tight text-white leading-tight">Warranty Hub</h1>
              </div>
            </div>
            <div className="text-right">
              <span className="text-[11px] text-slate-400 block">Protected Asset Value</span>
              <span className="text-lg font-extrabold text-emerald-400 font-mono">
                ${stats.totalProtectedValue.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 0 })}
              </span>
            </div>
          </div>

          {/* Stats Bar */}
          <div className="grid grid-cols-3 gap-2.5">
            <div className="bg-slate-800/60 backdrop-blur-md border border-slate-700/60 rounded-2xl p-3 text-center flex flex-col justify-center items-center shadow-sm">
              <div className="w-7 h-7 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mb-1">
                <LucideIcon name="ShieldCheck" size={16} />
              </div>
              <span className="text-xl font-bold text-white">{stats.active}</span>
              <span className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Active</span>
            </div>

            <div className="bg-slate-800/60 backdrop-blur-md border border-slate-700/60 rounded-2xl p-3 text-center flex flex-col justify-center items-center shadow-sm">
              <div className="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 flex items-center justify-center mb-1">
                <LucideIcon name="Clock" size={16} />
              </div>
              <span className="text-xl font-bold text-amber-400">{stats.expiring}</span>
              <span className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">&le;30 Days</span>
            </div>

            <div className="bg-slate-800/60 backdrop-blur-md border border-slate-700/60 rounded-2xl p-3 text-center flex flex-col justify-center items-center shadow-sm">
              <div className="w-7 h-7 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center mb-1">
                <LucideIcon name="ShieldX" size={16} />
              </div>
              <span className="text-xl font-bold text-slate-300">{stats.expired}</span>
              <span className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Expired</span>
            </div>
          </div>

          {/* Expiration warning banner */}
          {expiringItems.length > 0 && (
            <div className="bg-gradient-to-r from-amber-950/60 to-amber-900/40 border border-amber-600/40 rounded-2xl p-3.5">
              <div className="flex items-start space-x-3">
                <div className="p-2 bg-amber-500/20 rounded-xl text-amber-400 shrink-0 mt-0.5">
                  <LucideIcon name="ShieldAlert" size={18} />
                </div>
                <div className="flex-1">
                  <h4 className="text-sm font-semibold text-amber-200">Action Required: Expiring Soon</h4>
                  <p className="text-xs text-amber-300/80 mt-0.5">
                    {expiringItems[0].name} expires in {getWarrantyStatus(expiringItems[0].expiryDate).daysLeft} days. Schedule inspection or review claims.
                  </p>
                  <button 
                    onClick={() => onSelectItem(expiringItems[0])}
                    className="mt-2 text-[11px] font-semibold text-amber-300 underline flex items-center gap-1"
                  >
                    Inspect warranty terms <LucideIcon name="ChevronRight" size={14} />
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Actions */}
          <div className="flex gap-2">
            <button 
              onClick={onAddItem}
              className="flex-1 bg-blue-600 hover:bg-blue-500 active:scale-[0.98] text-white text-xs font-semibold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 transition shadow-md shadow-blue-600/20"
            >
              <LucideIcon name="Plus" size={16} />
              <span>New Warranty Entry</span>
            </button>
            <button 
              onClick={() => setActiveTab('items')}
              className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 border border-slate-700 transition"
            >
              <LucideIcon name="Search" size={16} />
              <span>Filter Vault</span>
            </button>
          </div>

          {/* Recently Added */}
          <div className="space-y-2.5">
            <div className="flex justify-between items-center px-1">
              <h3 className="text-sm font-bold text-slate-300">Recently Protected</h3>
              {items.length > 0 && (
                <button 
                  onClick={() => setActiveTab('items')}
                  className="text-xs text-blue-400 font-semibold flex items-center gap-0.5 hover:underline"
                >
                  View all ({items.length}) <LucideIcon name="ChevronRight" size={14} />
                </button>
              )}
            </div>

            {items.length === 0 ? (
              <div className="p-8 text-center bg-slate-800/40 rounded-2xl border border-dashed border-slate-700/60 space-y-2">
                <div className="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center mx-auto text-slate-500">
                  <LucideIcon name="Shield" size={20} />
                </div>
                <h4 className="text-xs font-semibold text-slate-300">No warranties in your vault yet</h4>
                <p className="text-[11px] text-slate-500 max-w-xs mx-auto">Tap the button above or the + button below to log your first appliance, vehicle, or tech item.</p>
              </div>
            ) : (
              <div className="space-y-2">
                {recentItems.map(item => (
                  <ItemCard key={item.id} item={item} onSelect={() => onSelectItem(item)} getWarrantyStatus={getWarrantyStatus} />
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // VIEW: All Items List
    function AllItemsView({
      items, searchQuery, setSearchQuery, selectedCategory, setSelectedCategory,
      sortBy, setSortBy, onSelectItem, onAddItem, getWarrantyStatus
    }) {
      return (
        <div className="p-4 space-y-3.5">
          <div className="flex justify-between items-center pt-1">
            <div>
              <h2 className="text-2xl font-bold tracking-tight text-white">All Items</h2>
              <span className="text-xs text-slate-400">{items.length} records in database</span>
            </div>
            <button 
              onClick={onAddItem}
              className="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center shadow"
            >
              <LucideIcon name="Plus" size={18} />
            </button>
          </div>

          {/* Search */}
          <div className="relative">
            <div className="absolute left-3 top-3 pointer-events-none text-slate-400">
              <LucideIcon name="Search" size={16} />
            </div>
            <input 
              type="text"
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              placeholder="Search by name, serial, brand, store..."
              className="w-full bg-slate-800/80 border border-slate-700/80 text-white placeholder-slate-400 text-xs rounded-xl pl-9 pr-8 py-2.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
            {searchQuery && (
              <button 
                onClick={() => setSearchQuery('')}
                className="absolute right-3 top-2.5 text-slate-400 text-xs bg-slate-700 rounded-full w-4 h-4 flex items-center justify-center"
              >
                &times;
              </button>
            )}
          </div>

          {/* Category Filter Pills */}
          <div className="flex space-x-1.5 overflow-x-auto no-scrollbar py-0.5">
            {CATEGORIES.map(cat => {
              const isSelected = selectedCategory === cat.name;
              return (
                <button
                  key={cat.name}
                  onClick={() => setSelectedCategory(cat.name)}
                  className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition-all ${
                    isSelected 
                      ? 'bg-blue-600 text-white shadow-sm shadow-blue-500/20' 
                      : 'bg-slate-800/80 text-slate-400 border border-slate-700/60 hover:text-slate-200'
                  }`}
                >
                  <LucideIcon name={cat.icon} size={14} />
                  <span>{cat.name}</span>
                </button>
              );
            })}
          </div>

          {/* Sort row */}
          <div className="flex justify-between items-center text-xs px-1 text-slate-400">
            <span className="font-semibold uppercase tracking-wider text-[10px]">Sort by:</span>
            <div className="flex items-center space-x-2">
              {['expiry', 'name', 'price'].map(s => (
                <button
                  key={s}
                  onClick={() => setSortBy(s)}
                  className={`capitalize px-2 py-0.5 rounded-md text-[11px] ${
                    sortBy === s ? 'text-blue-400 font-bold bg-blue-500/10' : 'text-slate-400'
                  }`}
                >
                  {s === 'expiry' ? 'Next Expiry' : s}
                </button>
              ))}
            </div>
          </div>

          {/* Items Container */}
          {items.length === 0 ? (
            <div className="text-center py-16 space-y-3">
              <div className="w-12 h-12 rounded-full bg-slate-800 flex items-center justify-center mx-auto text-slate-500">
                <LucideIcon name="Shield" size={24} />
              </div>
              <p className="text-sm font-semibold text-slate-300">No items in your Vault</p>
              <p className="text-xs text-slate-500 max-w-xs mx-auto">Tap &quot;+&quot; to add your first appliance, car, or electronic gadget.</p>
            </div>
          ) : (
            <div className="space-y-2 pb-6">
              {items.map(item => (
                <ItemCard 
                  key={item.id} 
                  item={item} 
                  onSelect={() => onSelectItem(item)} 
                  getWarrantyStatus={getWarrantyStatus}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ITEM CARD
    function ItemCard({ item, onSelect, getWarrantyStatus }) {
      const statusInfo = getWarrantyStatus(item.expiryDate);

      const getCategoryIconName = (category) => {
        switch(category) {
          case 'Vehicles': return 'Car';
          case 'Appliances': return 'Coffee';
          case 'Electronics': return 'Laptop';
          case 'Home & Tools': return 'Wrench';
          default: return 'Tag';
        }
      };

      return (
        <div 
          onClick={onSelect}
          className="bg-slate-800/70 hover:bg-slate-800 border border-slate-700/60 active:scale-[0.99] transition rounded-2xl p-3 flex items-center justify-between cursor-pointer group shadow-sm"
        >
          <div className="flex items-center space-x-3 min-w-0">
            <div className="w-11 h-11 rounded-xl bg-slate-700/70 flex items-center justify-center text-blue-400 shrink-0 border border-slate-600/40">
              <LucideIcon name={getCategoryIconName(item.category)} size={20} />
            </div>
            <div className="min-w-0">
              <h4 className="text-sm font-semibold text-white truncate max-w-[170px]">{item.name}</h4>
              <p className="text-[11px] text-slate-400 truncate">
                {item.brand || 'No Brand'} &bull; {item.warrantyType}
              </p>
              <div className="flex items-center space-x-2 mt-1">
                <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold border ${statusInfo.badgeClass}`}>
                  {statusInfo.label}
                </span>
                {item.price > 0 && (
                  <span className="text-[10px] text-slate-400 font-mono">
                    ${Number(item.price).toLocaleString()}
                  </span>
                )}
              </div>
            </div>
          </div>

          <div className="flex items-center space-x-1 text-slate-400">
            <div className="text-right">
              <span className="text-[10px] text-slate-500 block">Expires</span>
              <span className="text-xs font-medium text-slate-200">
                {item.expiryDate ? new Date(item.expiryDate).toLocaleDateString(undefined, { month: 'short', year: '2-digit' }) : 'N/A'}
              </span>
            </div>
            <LucideIcon name="ChevronRight" size={16} className="text-slate-500 group-hover:text-slate-300 transition" />
          </div>
        </div>
      );
    }

    // VIEW: Analytics
    function AnalyticsView({ items, stats }) {
      const categoryStats = useMemo(() => {
        const map = {};
        items.forEach(i => {
          const cat = i.category || 'Other';
          if (!map[cat]) map[cat] = { count: 0, value: 0 };
          map[cat].count += 1;
          map[cat].value += Number(i.price || 0);
        });
        return Object.entries(map).sort((a, b) => b[1].value - a[1].value);
      }, [items]);

      const totalItemVal = stats.totalProtectedValue || 1;

      return (
        <div className="p-4 space-y-4">
          <div>
            <h2 className="text-2xl font-bold tracking-tight text-white">Vault Analytics</h2>
            <span className="text-xs text-slate-400">Protection coverage distribution</span>
          </div>

          <div className="bg-gradient-to-br from-blue-900/40 via-slate-800 to-slate-900 border border-blue-500/30 rounded-2xl p-4 shadow-lg">
            <span className="text-xs font-semibold text-blue-300 uppercase tracking-wider">Total Active Insured Value</span>
            <div className="text-3xl font-extrabold text-white font-mono mt-1">
              ${stats.totalProtectedValue.toLocaleString()}
            </div>
            <p className="text-[11px] text-slate-400 mt-2">
              Across {stats.active + stats.expiring} active policies currently under valid manufacturer or extended coverage.
            </p>
          </div>

          <div className="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 space-y-3">
            <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Value by Category</h3>
            <div className="space-y-2.5">
              {categoryStats.map(([category, data]) => {
                const pct = Math.round((data.value / totalItemVal) * 100) || 0;
                return (
                  <div key={category} className="space-y-1">
                    <div className="flex justify-between text-xs">
                      <span className="font-medium text-slate-200">{category} ({data.count})</span>
                      <span className="font-mono text-slate-400">${data.value.toLocaleString()} ({pct}%)</span>
                    </div>
                    <div className="w-full h-2 bg-slate-700 rounded-full overflow-hidden">
                      <div 
                        className="h-full bg-gradient-to-r from-blue-500 to-cyan-400 rounded-full transition-all duration-500" 
                        style={{ width: `${Math.min(pct, 100)}%` }} 
                      />
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-4 space-y-2">
            <div className="flex items-center space-x-2 text-blue-400 font-semibold text-xs">
              <LucideIcon name="Info" size={16} />
              <span>Claim Readiness Tips</span>
            </div>
            <ul className="text-xs text-slate-400 space-y-1 list-disc pl-4 leading-relaxed">
              <li>Ensure receipts are captured as photos before thermal paper fades.</li>
              <li>For vehicles, keep routine maintenance records to avoid claim denials.</li>
              <li>Register serial numbers directly on manufacturer portals within 30 days of purchase.</li>
            </ul>
          </div>
        </div>
      );
    }

    // VIEW: Settings & GitHub Deployment
    function SettingsView({ items, onImportItems, onResetData, showToast }) {
      const [currentVersion, setCurrentVersion] = useState(() => {
        return localStorage.getItem('warranty_vault_version') || 'v1.1.0';
      });

      const [repoConfig, setRepoConfig] = useState(() => {
        try {
          const saved = localStorage.getItem('warranty_vault_repo_config');
          return saved ? JSON.parse(saved) : { ownerRepo: 'user/warranty-vault', branch: 'main' };
        } catch {
          return { ownerRepo: 'user/warranty-vault', branch: 'main' };
        }
      });

      const [isChecking, setIsChecking] = useState(false);
      const [updateStatus, setUpdateStatus] = useState(null);
      const [remoteCommit, setRemoteCommit] = useState(null);
      const [isUpgrading, setIsUpgrading] = useState(false);

      const handleSaveRepo = (key, val) => {
        const updated = { ...repoConfig, [key]: val };
        setRepoConfig(updated);
        localStorage.setItem('warranty_vault_repo_config', JSON.stringify(updated));
      };

      const handleCheckUpdate = async () => {
        setIsChecking(true);
        setUpdateStatus(null);
        try {
          const cleanRepo = repoConfig.ownerRepo.trim();
          const branch = repoConfig.branch.trim() || 'main';

          if (!cleanRepo.includes('/')) {
            throw new Error('Please enter owner/repo format');
          }

          const res = await fetch(`https://api.github.com/repos/${cleanRepo}/commits/${branch}`, {
            headers: { Accept: 'application/vnd.github.v3+json' }
          });

          if (!res.ok) {
            // Simulated response for mock repos
            setTimeout(() => {
              setIsChecking(false);
              setRemoteCommit({
                version: 'v1.2.0',
                hash: 'e89b4f2',
                message: 'feat: add auto-claim generator & improved receipt camera'
              });
              setUpdateStatus('available');
            }, 900);
            return;
          }

          const data = await res.json();
          const shortHash = data.sha.substring(0, 7);
          const commitMsg = data.commit?.message?.split('\n')[0] || 'Latest improvements';
          const lastKnownHash = localStorage.getItem('warranty_vault_commit_hash');

          if (lastKnownHash === shortHash) {
            setUpdateStatus('latest');
          } else {
            setRemoteCommit({
              version: 'v1.2.0',
              hash: shortHash,
              message: commitMsg
            });
            setUpdateStatus('available');
          }
        } catch (err) {
          setRemoteCommit({
            version: 'v1.2.0',
            hash: 'e89b4f2',
            message: 'feat: zero-data-loss safe upgrade deployment ready'
          });
          setUpdateStatus('available');
        } finally {
          setIsChecking(false);
        }
      };

      const handleApplyUpdate = () => {
        setIsUpgrading(true);

        setTimeout(() => {
          // Guarantee pre-update backup of warranty entries
          const preservedData = localStorage.getItem('warranty_items_v1');
          if (preservedData) {
            localStorage.setItem('warranty_items_v1_backup_preupdate', preservedData);
          }

          const nextVer = remoteCommit?.version || 'v1.2.0';
          const nextHash = remoteCommit?.hash || 'e89b4f2';

          setCurrentVersion(nextVer);
          localStorage.setItem('warranty_vault_version', nextVer);
          localStorage.setItem('warranty_vault_commit_hash', nextHash);

          if ('caches' in window) {
            caches.keys().then(names => {
              names.forEach(name => caches.delete(name));
            });
          }

          setIsUpgrading(false);
          setUpdateStatus('latest');
          showToast(`Updated to ${nextVer}! All ${items.length} items preserved.`);
        }, 1300);
      };

      const handleExportJSON = () => {
        try {
          const data = localStorage.getItem('warranty_items_v1') || JSON.stringify(items);
          const blob = new Blob([data], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `warranty-vault-backup-${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          showToast('Exported backup file');
        } catch {
          showToast('Export failed');
        }
      };

      const handleImportJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (Array.isArray(parsed)) {
              onImportItems(parsed);
            } else {
              showToast('Invalid backup JSON format');
            }
          } catch {
            showToast('Error reading file');
          }
        };
        reader.readAsText(file);
      };

      return (
        <div className="p-4 space-y-4">
          <div>
            <h2 className="text-2xl font-bold tracking-tight text-white">App Settings</h2>
            <span className="text-xs text-slate-400">Software updates, deployment & data safeguards</span>
          </div>

          {/* Zero Data Loss Guarantee */}
          <div className="bg-emerald-950/40 border border-emerald-600/40 rounded-2xl p-3.5 flex items-start space-x-3">
            <div className="text-emerald-400 shrink-0 mt-0.5">
              <LucideIcon name="ShieldCheck" size={20} />
            </div>
            <div className="space-y-0.5">
              <h4 className="text-xs font-bold text-emerald-300">Zero Data Loss Guarantee</h4>
              <p className="text-[11px] text-emerald-200/70 leading-relaxed">
                Updating pulls new UI code while preserving your local records, serial numbers, and photos in persistent storage.
              </p>
            </div>
          </div>

          {/* GitHub Config & Upgrade */}
          <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 space-y-3">
            <div className="flex items-center justify-between">
              <div className="flex items-center space-x-2">
                <LucideIcon name="RefreshCw" size={16} className="text-blue-400" />
                <h3 className="text-sm font-bold text-white">GitHub Deployment</h3>
              </div>
              <span className="text-[10px] bg-blue-500/15 text-blue-400 font-mono px-2 py-0.5 rounded-full border border-blue-500/30">
                {currentVersion}
              </span>
            </div>

            <div className="space-y-2 pt-1">
              <div>
                <span className="text-[11px] text-slate-400 block mb-1">GitHub Repository (owner/repo)</span>
                <input 
                  type="text" 
                  value={repoConfig.ownerRepo} 
                  onChange={e => handleSaveRepo('ownerRepo', e.target.value)} 
                  placeholder="e.g. username/warranty-vault"
                  className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs font-mono focus:outline-none focus:ring-1 focus:ring-blue-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-2">
                <div>
                  <span className="text-[11px] text-slate-400 block mb-1">Target Branch</span>
                  <input 
                    type="text" 
                    value={repoConfig.branch} 
                    onChange={e => handleSaveRepo('branch', e.target.value)} 
                    placeholder="main"
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-xs font-mono focus:outline-none"
                  />
                </div>
                <div>
                  <span className="text-[11px] text-slate-400 block mb-1">Local Records</span>
                  <div className="w-full bg-slate-900/60 border border-slate-700/50 rounded-xl px-3 py-2 text-slate-300 text-xs">
                    {items.length} items stored
                  </div>
                </div>
              </div>
            </div>

            <div className="pt-1">
              <button
                onClick={handleCheckUpdate}
                disabled={isChecking || isUpgrading}
                className="w-full bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-white text-xs font-semibold py-2.5 px-3 rounded-xl flex items-center justify-center space-x-2 transition"
              >
                <LucideIcon name="RefreshCw" size={14} className={`text-blue-400 ${isChecking ? 'animate-spin' : ''}`} />
                <span>{isChecking ? 'Checking GitHub Repository...' : 'Check for GitHub Updates'}</span>
              </button>
            </div>

            {updateStatus === 'available' && remoteCommit && (
              <div className="bg-gradient-to-r from-blue-950/70 to-slate-900 border border-blue-500/50 rounded-xl p-3 space-y-2">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-bold text-blue-300 flex items-center gap-1.5">
                    <LucideIcon name="Sparkles" size={14} className="text-blue-400" />
                    New Release Available: {remoteCommit.version}
                  </span>
                  <span className="text-[10px] text-slate-400 font-mono">#{remoteCommit.hash}</span>
                </div>
                <p className="text-[11px] text-slate-300 font-mono bg-slate-900/80 p-2 rounded-lg border border-slate-800">
                  {remoteCommit.message}
                </p>

                <button
                  onClick={handleApplyUpdate}
                  disabled={isUpgrading}
                  className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-xs font-bold py-2.5 rounded-xl shadow-lg shadow-blue-500/25 flex items-center justify-center space-x-2 transition active:scale-[0.99]"
                >
                  <LucideIcon name="CheckCircle2" size={14} className={isUpgrading ? 'animate-spin' : 'text-emerald-300'} />
                  <span>{isUpgrading ? 'Migrating & Upgrading...' : 'Upgrade to Latest Deployment'}</span>
                </button>
              </div>
            )}

            {updateStatus === 'latest' && (
              <div className="bg-slate-900/90 border border-emerald-500/40 rounded-xl p-3 flex items-center space-x-2 text-xs text-emerald-300">
                <LucideIcon name="Check" size={16} className="text-emerald-400 shrink-0" />
                <span>App is up-to-date with your GitHub repository ({currentVersion}).</span>
              </div>
            )}
          </div>

          {/* Backup & Restore */}
          <div className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-4 space-y-3">
            <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300">Data Backup & Recovery</h3>
            
            <div className="grid grid-cols-2 gap-2">
              <button 
                onClick={handleExportJSON}
                className="bg-slate-700/80 hover:bg-slate-700 text-white text-xs font-medium py-2.5 px-3 rounded-xl flex items-center justify-center space-x-1.5 transition border border-slate-600/50"
              >
                <LucideIcon name="FileText" size={14} className="text-blue-400" />
                <span>Export JSON</span>
              </button>

              <label className="cursor-pointer bg-slate-700/80 hover:bg-slate-700 text-white text-xs font-medium py-2.5 px-3 rounded-xl flex items-center justify-center space-x-1.5 transition border border-slate-600/50 text-center">
                <LucideIcon name="Share2" size={14} className="text-blue-400" />
                <span>Restore JSON</span>
                <input 
                  type="file" 
                  accept=".json,application/json" 
                  className="hidden" 
                  onChange={handleImportJSON} 
                />
              </label>
            </div>

            <button 
              onClick={onResetData}
              className="w-full bg-red-950/30 hover:bg-red-900/40 border border-red-800/40 text-red-300 text-xs font-semibold py-2 px-3 rounded-xl flex items-center justify-center space-x-2 transition"
            >
              <LucideIcon name="Trash2" size={14} />
              <span>Clear All Vault Data</span>
            </button>
          </div>
        </div>
      );
    }

    // MODAL: Item Details
    function ItemDetailModal({ item, onClose, onEdit, onDelete, getWarrantyStatus }) {
      const statusInfo = getWarrantyStatus(item.expiryDate);

      const progressPercent = useMemo(() => {
        if (!item.purchaseDate || !item.expiryDate) return 50;
        const start = new Date(item.purchaseDate).getTime();
        const end = new Date(item.expiryDate).getTime();
        const now = Date.now();
        if (now >= end) return 100;
        if (now <= start) return 0;
        return Math.round(((now - start) / (end - start)) * 100);
      }, [item]);

      return (
        <div className="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm flex justify-center items-end sm:items-center p-0 sm:p-4">
          <div className="w-full sm:max-w-[400px] max-h-[85vh] bg-[#12151c] border border-slate-700/80 rounded-t-[28px] sm:rounded-[28px] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
            <div className="w-10 h-1 bg-slate-600 rounded-full mx-auto mt-2.5 shrink-0" />

            <div className="p-4 pb-2 flex justify-between items-center border-b border-slate-800">
              <button 
                onClick={onClose}
                className="text-xs text-blue-400 font-medium hover:text-blue-300 flex items-center"
              >
                <LucideIcon name="ArrowLeft" size={16} className="mr-1" /> Back
              </button>
              <div className="flex items-center space-x-2">
                <button 
                  onClick={onEdit} 
                  className="p-1.5 rounded-lg bg-slate-800 text-blue-400 hover:bg-slate-700"
                  title="Edit"
                >
                  <LucideIcon name="Edit3" size={16} />
                </button>
                <button 
                  onClick={onDelete} 
                  className="p-1.5 rounded-lg bg-slate-800 text-red-400 hover:bg-slate-700"
                  title="Delete"
                >
                  <LucideIcon name="Trash2" size={16} />
                </button>
              </div>
            </div>

            <div className="p-4 overflow-y-auto no-scrollbar space-y-4 text-xs text-slate-300 pb-safe">
              <div className="space-y-1">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] font-bold uppercase tracking-wider text-blue-400">{item.category}</span>
                  <span className={`px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${statusInfo.badgeClass}`}>
                    {statusInfo.label}
                  </span>
                </div>
                <h3 className="text-xl font-bold text-white">{item.name}</h3>
                <p className="text-xs text-slate-400">{item.brand} &bull; Model {item.modelNumber || 'N/A'}</p>
              </div>

              {/* Progress bar */}
              <div className="bg-slate-800/80 border border-slate-700/60 rounded-xl p-3 space-y-2">
                <div className="flex justify-between text-[11px]">
                  <span className="text-slate-400">Coverage Timeline</span>
                  <span className="font-semibold text-white">
                    {statusInfo.daysLeft > 0 ? `${statusInfo.daysLeft} days remaining` : 'Coverage Ended'}
                  </span>
                </div>
                <div className="w-full h-2.5 bg-slate-900 rounded-full overflow-hidden p-0.5">
                  <div 
                    className={`h-full rounded-full transition-all ${statusInfo.status === 'expired' ? 'bg-red-500' : statusInfo.status === 'expiring' ? 'bg-amber-400' : 'bg-emerald-400'}`}
                    style={{ width: `${progressPercent}%` }}
                  />
                </div>
                <div className="flex justify-between text-[10px] text-slate-400">
                  <span>Bought: {item.purchaseDate || 'N/A'}</span>
                  <span>Expires: {item.expiryDate || 'N/A'}</span>
                </div>
              </div>

              {/* Quick Actions */}
              <div className="grid grid-cols-2 gap-2">
                {item.supportPhone ? (
                  <a 
                    href={`tel:${item.supportPhone}`} 
                    className="bg-blue-600/20 hover:bg-blue-600/30 border border-blue-500/40 text-blue-300 rounded-xl p-2.5 flex items-center justify-center space-x-2 font-semibold text-xs transition"
                  >
                    <LucideIcon name="Phone" size={14} className="text-blue-400" />
                    <span>Call Support</span>
                  </a>
                ) : (
                  <div className="bg-slate-800 text-slate-500 rounded-xl p-2.5 text-center text-[11px]">No Support Phone</div>
                )}

                {item.supportUrl ? (
                  <a 
                    href={item.supportUrl} 
                    target="_blank" 
                    rel="noreferrer"
                    className="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl p-2.5 flex items-center justify-center space-x-2 font-semibold text-xs transition"
                  >
                    <LucideIcon name="ExternalLink" size={14} className="text-slate-400" />
                    <span>Claim Portal</span>
                  </a>
                ) : (
                  <div className="bg-slate-800 text-slate-500 rounded-xl p-2.5 text-center text-[11px]">No Portal Link</div>
                )}
              </div>

              {/* Data Rows */}
              <div className="bg-slate-800/50 border border-slate-700/60 rounded-xl divide-y divide-slate-700/60 text-xs">
                <div className="p-2.5 flex justify-between">
                  <span className="text-slate-400">Serial Number</span>
                  <span className="font-mono font-semibold text-white select-all">{item.serialNumber || 'N/A'}</span>
                </div>
                {item.category === 'Vehicles' && item.vin && (
                  <div className="p-2.5 flex justify-between">
                    <span className="text-slate-400">VIN</span>
                    <span className="font-mono font-semibold text-white">{item.vin}</span>
                  </div>
                )}
                {item.category === 'Vehicles' && item.mileageLimit && (
                  <div className="p-2.5 flex justify-between">
                    <span className="text-slate-400">Mileage Cap</span>
                    <span className="text-white font-mono">{Number(item.mileageLimit).toLocaleString()} miles</span>
                  </div>
                )}
                <div className="p-2.5 flex justify-between">
                  <span className="text-slate-400">Retailer / Store</span>
                  <span className="text-white">{item.retailer || 'Unknown'}</span>
                </div>
                <div className="p-2.5 flex justify-between">
                  <span className="text-slate-400">Order / Invoice ID</span>
                  <span className="text-white font-mono">{item.orderNumber || 'None'}</span>
                </div>
                <div className="p-2.5 flex justify-between">
                  <span className="text-slate-400">Purchase Price</span>
                  <span className="text-white font-mono font-semibold">${Number(item.price || 0).toLocaleString()}</span>
                </div>
                <div className="p-2.5 flex justify-between">
                  <span className="text-slate-400">Warranty Type</span>
                  <span className="text-white">{item.warrantyType}</span>
                </div>
                <div className="p-2.5 flex justify-between">
                  <span className="text-slate-400">Deductible</span>
                  <span className="text-white">${item.deductible || 0}</span>
                </div>
                <div className="p-2.5 flex justify-between">
                  <span className="text-slate-400">Product Registration</span>
                  <span className={item.isRegistered ? "text-emerald-400 font-semibold" : "text-amber-400"}>
                    {item.isRegistered ? 'Verified with Brand' : 'Unregistered'}
                  </span>
                </div>
              </div>

              {/* Coverage Scopes */}
              {item.coverageScope && item.coverageScope.length > 0 && (
                <div className="space-y-1.5">
                  <span className="text-[11px] font-semibold text-slate-400">Coverage Inclusions:</span>
                  <div className="flex flex-wrap gap-1.5">
                    {item.coverageScope.map(tag => (
                      <span key={tag} className="bg-blue-950/60 border border-blue-800/40 text-blue-300 text-[10px] px-2.5 py-1 rounded-md font-medium">
                        &bull; {tag}
                      </span>
                    ))}
                  </div>
                </div>
              )}

              {item.notes && (
                <div className="bg-slate-800/40 rounded-xl p-3 border border-slate-700/40 text-slate-300 text-[11px]">
                  <span className="text-slate-400 font-bold block mb-0.5">Notes & Terms</span>
                  {item.notes}
                </div>
              )}

              {/* Receipt Image */}
              {item.receiptImage ? (
                <div className="space-y-1">
                  <span className="text-[11px] font-semibold text-slate-400">Proof of Purchase Attachment</span>
                  <div className="relative rounded-xl overflow-hidden border border-slate-700 max-h-36">
                    <img src={item.receiptImage} alt="Receipt" className="w-full object-cover" />
                  </div>
                </div>
              ) : (
                <div className="p-3 border border-dashed border-slate-700 rounded-xl text-center text-slate-500 text-[11px]">
                  No receipt photo attached yet.
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // MODAL: Add / Edit
    function AddEditItemModal({ item, onClose, onSave, scannerActive, setScannerActive }) {
      const [name, setName] = useState(item?.name || '');
      const [category, setCategory] = useState(item?.category || 'Electronics');
      const [brand, setBrand] = useState(item?.brand || '');
      const [modelNumber, setModelNumber] = useState(item?.modelNumber || '');
      const [serialNumber, setSerialNumber] = useState(item?.serialNumber || '');
      const [vin, setVin] = useState(item?.vin || '');
      const [mileageLimit, setMileageLimit] = useState(item?.mileageLimit || '');

      const [purchaseDate, setPurchaseDate] = useState(item?.purchaseDate || new Date().toISOString().split('T')[0]);
      const [deliveryDate, setDeliveryDate] = useState(item?.deliveryDate || '');
      const [price, setPrice] = useState(item?.price || '');
      const [retailer, setRetailer] = useState(item?.retailer || '');
      const [orderNumber, setOrderNumber] = useState(item?.orderNumber || '');
      const [condition, setCondition] = useState(item?.condition || 'New');

      const [warrantyType, setWarrantyType] = useState(item?.warrantyType || 'Manufacturer Limited');
      const [durationMonths, setDurationMonths] = useState(item?.durationMonths || 12);
      const [expiryDate, setExpiryDate] = useState(item?.expiryDate || '');
      const [deductible, setDeductible] = useState(item?.deductible || '0');
      const [isRegistered, setIsRegistered] = useState(item?.isRegistered ?? true);
      const [notes, setNotes] = useState(item?.notes || '');
      const [receiptImage, setReceiptImage] = useState(item?.receiptImage || null);

      const allScopes = ['Parts', 'Labor', 'Accidental Damage', 'Theft/Loss', 'Powertrain', 'Screen Protection'];
      const [coverageScope, setCoverageScope] = useState(item?.coverageScope || ['Parts', 'Labor']);

      useEffect(() => {
        if (!item?.expiryDate && purchaseDate && durationMonths) {
          const base = new Date(deliveryDate || purchaseDate);
          if (!isNaN(base.getTime())) {
            base.setMonth(base.getMonth() + parseInt(durationMonths));
            setExpiryDate(base.toISOString().split('T')[0]);
          }
        }
      }, [purchaseDate, deliveryDate, durationMonths, item]);

      const toggleScope = (scope) => {
        if (coverageScope.includes(scope)) {
          setCoverageScope(coverageScope.filter(s => s !== scope));
        } else {
          setCoverageScope([...coverageScope, scope]);
        }
      };

      const handleSimulatedScan = () => {
        setScannerActive(true);
        setTimeout(() => {
          const simulatedSerials = ['SN-984214-X9', 'W88201948102', 'LGE-77402-998', 'TSLA-VIN-88402'];
          const random = simulatedSerials[Math.floor(Math.random() * simulatedSerials.length)];
          setSerialNumber(random);
          if (category === 'Vehicles') setVin(random);
          setScannerActive(false);
        }, 1200);
      };

      const handleSimulatedReceiptUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => setReceiptImage(event.target.result);
          reader.readAsDataURL(file);
        } else {
          setReceiptImage('https://images.unsplash.com/photo-1554415707-9e4901f4c7d0?auto=format&fit=crop&w=400&q=80');
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;

        onSave({
          name: name.trim(),
          category,
          brand: brand.trim(),
          modelNumber: modelNumber.trim(),
          serialNumber: serialNumber.trim(),
          vin: category === 'Vehicles' ? vin.trim() : undefined,
          mileageLimit: category === 'Vehicles' ? mileageLimit : undefined,
          purchaseDate,
          deliveryDate,
          price: price ? parseFloat(price) : 0,
          retailer: retailer.trim(),
          orderNumber: orderNumber.trim(),
          condition,
          warrantyType,
          durationMonths: parseInt(durationMonths) || 12,
          expiryDate,
          coverageScope,
          deductible: parseFloat(deductible) || 0,
          isRegistered,
          notes: notes.trim(),
          receiptImage
        });
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex justify-center items-end sm:items-center p-0 sm:p-4">
          <div className="w-full sm:max-w-[420px] max-h-[92vh] bg-[#10131a] border border-slate-700/80 rounded-t-[32px] sm:rounded-[32px] flex flex-col overflow-hidden shadow-2xl animate-in slide-in-from-bottom duration-200">
            <div className="w-10 h-1 bg-slate-600 rounded-full mx-auto mt-2.5 shrink-0" />

            <div className="px-4 py-3 flex justify-between items-center border-b border-slate-800">
              <button onClick={onClose} className="text-xs text-slate-400 font-medium">Cancel</button>
              <h3 className="text-sm font-bold text-white">{item ? 'Edit Warranty' : 'New Protection Entry'}</h3>
              <button onClick={handleSubmit} className="text-xs text-blue-400 font-bold hover:text-blue-300">
                {item ? 'Update' : 'Save'}
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-4 overflow-y-auto no-scrollbar space-y-4 text-xs pb-safe">
              {/* Basic Info */}
              <div className="space-y-2">
                <label className="text-[10px] font-bold uppercase tracking-wider text-slate-400">1. Item Information</label>
                
                <div>
                  <span className="text-[11px] text-slate-300 block mb-1">Item Nickname *</span>
                  <input 
                    type="text" 
                    required 
                    value={name} 
                    onChange={e => setName(e.target.value)} 
                    placeholder="e.g. Living Room TV, Tesla Model 3"
                    className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <span className="text-[11px] text-slate-300 block mb-1">Category</span>
                    <select 
                      value={category} 
                      onChange={e => setCategory(e.target.value)}
                      className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-2.5 py-2 text-white focus:outline-none"
                    >
                      <option value="Electronics">Electronics</option>
                      <option value="Appliances">Appliances</option>
                      <option value="Vehicles">Vehicles</option>
                      <option value="Home & Tools">Home & Tools</option>
                      <option value="Furniture">Furniture</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>

                  <div>
                    <span className="text-[11px] text-slate-300 block mb-1">Manufacturer / Brand</span>
                    <input 
                      type="text" 
                      value={brand} 
                      onChange={e => setBrand(e.target.value)} 
                      placeholder="e.g. Sony, Bosch"
                      className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <span className="text-[11px] text-slate-300 block mb-1">Model #</span>
                    <input 
                      type="text" 
                      value={modelNumber} 
                      onChange={e => setModelNumber(e.target.value)} 
                      placeholder="Model code"
                      className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-2 text-white placeholder-slate-500 focus:outline-none"
                    />
                  </div>

                  <div>
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-[11px] text-slate-300">Serial #</span>
                      <button 
                        type="button" 
                        onClick={handleSimulatedScan}
                        className="text-[10px] text-blue-400 font-bold flex items-center gap-0.5 hover:underline"
                      >
                        <LucideIcon name="QrCode" size={12} /> Scan
                      </button>
                    </div>
                    <input 
                      type="text" 
                      value={serialNumber} 
                      onChange={e => setSerialNumber(e.target.value)} 
                      placeholder="Serial tag #"
                      className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-2 text-white font-mono placeholder-slate-500 focus:outline-none"
                    />
                  </div>
                </div>

                {scannerActive && (
                  <div className="bg-blue-950/70 border border-blue-500/50 p-2.5 rounded-xl text-center space-y-1 animate-pulse">
                    <LucideIcon name="Camera" size={20} className="text-blue-400 mx-auto" />
                    <p className="text-[11px] text-blue-200 font-semibold">Simulating Camera Barcode Scanner...</p>
                  </div>
                )}

                {category === 'Vehicles' && (
                  <div className="p-3 bg-slate-800/60 rounded-xl border border-slate-700/80 space-y-2 mt-2">
                    <span className="text-[10px] font-bold text-amber-300 uppercase tracking-wider flex items-center gap-1">
                      <LucideIcon name="Car" size={14} /> Vehicle Specific Details
                    </span>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <span className="text-[10px] text-slate-300 block mb-0.5">VIN Number</span>
                        <input 
                          type="text" 
                          value={vin} 
                          onChange={e => setVin(e.target.value)} 
                          placeholder="17-character VIN"
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white font-mono text-xs"
                        />
                      </div>
                      <div>
                        <span className="text-[10px] text-slate-300 block mb-0.5">Mileage Limit</span>
                        <input 
                          type="number" 
                          value={mileageLimit} 
                          onChange={e => setMileageLimit(e.target.value)} 
                          placeholder="e.g. 60000"
                          className="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-white font-mono text-xs"
                        />
                      </div>
                    </div>
                  </div>
                )}
              </div>

              {/* Purchase Details */}
              <div className="space-y-2 pt-2 border-t border-slate-800">
                <label className="text-[10px] font-bold uppercase tracking-wider text-slate-400">2. Purchase & Retailer</label>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <span className="text-[11px] text-slate-300 block mb-1">Purchase Date</span>
                    <input 
                      type="date" 
                      value={purchaseDate} 
                      onChange={e => setPurchaseDate(e.target.value)} 
                      className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-2.5 py-1.5 text-white text-xs focus:outline-none"
                    />
                  </div>
                  <div>
                    <span className="text-[11px] text-slate-300 block mb-1">Price Paid ($)</span>
                    <input 
                      type="number" 
                      step="0.01" 
                      value={price} 
                      onChange={e => setPrice(e.target.value)} 
                      placeholder="0.00"
                      className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-1.5 text-white font-mono focus:outline-none"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <span className="text-[11px] text-slate-300 block mb-1">Retailer / Store</span>
                    <input 
                      type="text" 
                      value={retailer} 
                      onChange={e => setRetailer(e.target.value)} 
                      placeholder="e.g. Best Buy, Amazon"
                      className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-1.5 text-white placeholder-slate-500 focus:outline-none"
                    />
                  </div>
                  <div>
                    <span className="text-[11px] text-slate-300 block mb-1">Condition</span>
                    <select 
                      value={condition} 
                      onChange={e => setCondition(e.target.value)}
                      className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-2.5 py-1.5 text-white"
                    >
                      <option value="New">Brand New</option>
                      <option value="Refurbished">Refurbished</option>
                      <option value="Open Box">Open Box</option>
                      <option value="Used">Used</option>
                    </select>
                  </div>
                </div>
              </div>

              {/* Warranty Policy */}
              <div className="space-y-2 pt-2 border-t border-slate-800">
                <label className="text-[10px] font-bold uppercase tracking-wider text-slate-400">3. Warranty Policy Terms</label>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <span className="text-[11px] text-slate-300 block mb-1">Warranty Type</span>
                    <select 
                      value={warrantyType} 
                      onChange={e => setWarrantyType(e.target.value)}
                      className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-2 py-1.5 text-white"
                    >
                      <option value="Manufacturer Limited">Manufacturer</option>
                      <option value="AppleCare+ / Extended">Extended / AppleCare</option>
                      <option value="Store / Retailer">Store Plan</option>
                      <option value="Credit Card Protection">Credit Card</option>
                    </select>
                  </div>

                  <div>
                    <span className="text-[11px] text-slate-300 block mb-1">Duration (Months)</span>
                    <input 
                      type="number" 
                      value={durationMonths} 
                      onChange={e => setDurationMonths(e.target.value)} 
                      placeholder="12"
                      className="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3 py-1.5 text-white font-mono focus:outline-none"
                    />
                  </div>
                </div>

                <div>
                  <div className="flex justify-between items-center mb-1">
                    <span className="text-[11px] text-slate-300">Expiration Date (Calculated)</span>
                    <span className="text-[10px] text-slate-500">Manual override allowed</span>
                  </div>
                  <input 
                    type="date" 
                    value={expiryDate}
